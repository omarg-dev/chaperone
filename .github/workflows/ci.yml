name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example env is a working file: the checks run with it as .env.
      - run: cp .env.example .env
      - run: pnpm lint
      - run: pnpm check
      # A skipped test fails the run: a green run that quietly ran fewer tests looks exactly like
      # one that ran them all. Vitest's summary line reads "Tests  N passed | M skipped (T)".
      - name: Tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-out.txt
          if grep -qiE '\b[1-9][0-9]* (skipped|todo)\b' test-out.txt; then
            echo "::error::Tests were skipped. CI is configured to run all of them."
            exit 1
          fi
      - run: pnpm build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same platform as the deploy image, so this checks what the server will run.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The arm64 image can't run on this x86 runner at full speed, so start a native build of the
      # same Dockerfile and check its HEALTHCHECK passes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: firewall-server:ci
          cache-from: type=gha
      - name: Container starts healthy
        run: |
          docker run -d --name app firewall-server:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs app
          echo "::error::The container never reported healthy."
          exit 1
      # The image serves the web app at /, not only the API: the build bundles apps/web/dist.
      - name: Container serves the web app
        run: |
          docker exec app node -e "fetch('http://127.0.0.1:3000/').then((r) => r.text()).then((t) => process.exit(t.includes('id=\"root\"') ? 0 : 1), () => process.exit(1))" \
            || { docker logs app; echo "::error::GET / did not return the web app."; exit 1; }

  # What only runs on the server: the compose file, the example .env it reads, the backup script and
  # the commands the README tells Omar to run there. The example env is a working file, so the checks
  # use it as the server's .env.
  deploy-config:
    name: Deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file resolves with the example env
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
          # Nothing is published on the host, and the app is on the shared gateway network.
          if docker compose config | grep -q 'published:'; then
            echo "::error::compose.yml publishes a host port."
            exit 1
          fi
      # Not checked here: the Caddyfile. Its rate_limit directive belongs to the custom Caddy build on
      # the server, which a stock `caddy validate` rejects, and building that plugin in CI costs more
      # than the file is worth. deploy/Caddyfile.example is reviewed by eye and by the server's own
      # `caddy reload`, which refuses a bad file and keeps the old config.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chaperone-ci:ci
          cache-from: type=gha
      # Run it the way the server does: this compose file, the example env, a data folder owned by
      # uid 1000, a gateway network of the same name. Then do what the README has Omar do there.
      - name: Container starts healthy under compose
        working-directory: deploy
        env:
          IMAGE_REPO: chaperone-ci
          IMAGE_TAG: ci
        run: |
          docker network create web-gateway
          mkdir -p data
          sudo chown 1000:1000 data
          docker compose up -d
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' chaperone)" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker compose logs
          echo "::error::The container never reported healthy."
          exit 1
      - name: Runs as uid 1000
        working-directory: deploy
        run: test "$(docker compose exec -T app id -u)" = 1000
        env:
          IMAGE_REPO: chaperone-ci
          IMAGE_TAG: ci
      - name: The backup command makes a good backup
        working-directory: deploy
        env:
          IMAGE_REPO: chaperone-ci
          IMAGE_TAG: ci
        run: |
          # The same command the server's nightly cron runs (README, "The nightly backup").
          docker compose exec -T app node dist/cli.js backup --keep 14
          # The backups folder belongs to the container's user and is private to it, so it is
          # listed from inside the container rather than by the runner.
          docker compose exec -T app ls -l /data/backups
          test "$(docker compose exec -T app sh -c 'ls /data/backups/events-*.db | wc -l')" = 1
      - name: Runs export and import in the container
        working-directory: deploy
        env:
          IMAGE_REPO: chaperone-ci
          IMAGE_TAG: ci
        run: |
          docker compose exec -T app node dist/cli.js export-runs > runs.json
          docker compose exec -T app node dist/cli.js import-runs - < runs.json
