name: Prod guard

# prod only ever receives dev. Make this check required on prod's branch protection.
on:
  pull_request:
    branches: [prod]

permissions: {}

jobs:
  from-dev:
    name: PR comes from dev
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs into prod must come from dev (this one is from '$HEAD_REF')."
            exit 1
          fi
