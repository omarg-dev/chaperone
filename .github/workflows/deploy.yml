name: Deploy

# Merging into prod deploys production. There's no staging: dev is where PRs land, not a server.
on:
  push:
    branches: [prod]
  workflow_dispatch:

# A deploy is never cancelled: one killed halfway leaves the server in a state nothing describes.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

# The least each job needs; the image job overrides this with its own.
permissions:
  contents: read

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The image name comes from the repository this runs in, so renaming the repository renames
      # the image. Registry names must be lower case.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # The server is an ARM (arm64) box; QEMU lets the x86 runner build for it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    # Off until the server is set up: set the repo variable DEPLOY_ENABLED=true (see README).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/compose.yml
            deploy/backup.sh
          sparse-checkout-cone-mode: false

      # The server never checks out the repo: the compose file and the backup script travel with
      # each deploy, over the same SSH session, so they can't drift from the version in git.
      - name: Pack the deploy files
        run: |
          echo "COMPOSE_B64=$(base64 -w0 deploy/compose.yml)" >> "$GITHUB_ENV"
          echo "BACKUP_B64=$(base64 -w0 deploy/backup.sh)" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          # The branch tag, as in the server's .env: a hand-run `docker compose up -d` there finds
          # the image without pulling, and the image it replaces loses its tag, so
          # `docker image prune` clears it. The per-commit tags stay on ghcr.io for going back.
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
          BACKUP_B64: ${{ env.BACKUP_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_PATH,IMAGE_TAG,IMAGE_REPO,COMPOSE_B64,BACKUP_B64
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "$COMPOSE_B64" | base64 -d > compose.yml.new
            mv compose.yml.new compose.yml
            echo "$BACKUP_B64" | base64 -d > backup.sh.new
            chmod +x backup.sh.new
            mv backup.sh.new backup.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # The token dies with the job; don't leave it behind in ~/.docker/config.json.
            trap 'docker logout ghcr.io > /dev/null' EXIT
            export IMAGE_TAG IMAGE_REPO
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "$APP_URL/health"; then exit 0; fi
            sleep 5
          done
          echo "::error::$APP_URL/health did not come up"
          exit 1
