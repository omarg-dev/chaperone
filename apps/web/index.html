<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaperone</title>
    <meta name="description" content="Chaperone, the parent to your shopping agent. It holds an AI agent's payment until the cart is checked against what you asked for." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a remembered theme before the first paint, so the page doesn't flash the other one.
      // Same rule as readPreference in src/theme/theme.ts.
      try {
        var theme = localStorage.getItem("chaperone-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
